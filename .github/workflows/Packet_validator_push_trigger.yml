name: packet-validator-stage Manual Build

on: 
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch name to build from'
        required: true
        default: 'develop'
        type: string
      docker_tag:
        description: 'Docker tag (optional, defaults to branch name)'
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Checkout Kernel Repository
        uses: actions/checkout@v4
        with:
          repository: mosip/kernel
          ref: ${{ github.event.inputs.branch }}
          path: kernel

      - name: Build and Install Kernel
        run: |
          cd kernel
          mvn -B clean install -DskipTests

      - name: Build Registration Processor
        run: |
          cd registration-processor
          mvn -B clean package -DskipTests

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Upload JAR artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release
          path: registration-processor/pre-processor/registration-processor-packet-validator-stage/target/*.jar

      - name: Build Docker image
        run: |
          cd registration-processor/pre-processor/registration-processor-packet-validator-stage
          docker build . \
            --build-arg SOURCE=mosip \
            --build-arg COMMIT_HASH=$(git rev-parse HEAD) \
            --build-arg COMMIT_ID=$(git rev-parse --short HEAD) \
            --build-arg BUILD_TIME=${{ steps.date.outputs.date }} \
            --tag registration-processor-packet-validator-stage

      - name: Log into registry
        run: echo "${{ secrets.release_docker_hub }}" | docker login -u ${{ secrets.actor_docker_hub }} --password-stdin

      - name: Push Docker image
        run: |
          NAMESPACE="${{ secrets.dev_namespace_docker_hub }}"
          SERVICE_NAME="registration-processor-packet-validator-stage"
          VERSION="${{ github.event.inputs.docker_tag || github.event.inputs.branch }}"
          IMAGE_ID=$(echo "$NAMESPACE/$SERVICE_NAME" | tr '[A-Z]' '[a-z]')
          docker tag registration-processor-packet-validator-stage $IMAGE_ID:$VERSION
          docker push $IMAGE_ID:$VERSION
